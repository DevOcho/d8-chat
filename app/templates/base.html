<!DOCTYPE html>
<html lang="en" {% block html_theme %}{% endblock %}>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="csrf-token" content="{{ csrf_token() }}">
        <!-- CSS & Icons -->
        <link rel="stylesheet"
              href="{{ static_url('css/local/bootstrap.min.css') }}">
        <link rel="stylesheet"
              href="{{ static_url('css/local/bootstrap-icons.css') }}">
        <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
        <link rel="stylesheet" href="{{ static_url('css/syntax.css') }}">
        <title>D8 - Chat</title>
        <link rel="icon"
              type="image/png"
              sizes="32x32"
              href="{{ static_url('favicon-32x32.png') }}">
        <link rel="icon"
              type="image/png"
              sizes="16x16"
              href="{{ static_url('favicon-16x16.png') }}">
        <link rel="apple-touch-icon"
              sizes="180x180"
              href="{{ static_url('apple-touch-icon.png') }}">
        <link rel="manifest" href="{{ static_url('site.webmanifest') }}">
        {# Before the body renders, so a "system" theme never flashes. #}
        <script src="{{ static_url('js/theme.js') }}"></script>
    </head>
    <body class="{% block body_class %}{% endblock %}">
        <div class="main-layout">
            {% block layout %}
                <div class="container mt-4">
                    {% block content %}{% endblock %}
                </div>
            {% endblock layout %}
        </div>
        <!-- Bootstrap, HTMX, and HTMX Websockets -->
        <script src="{{ static_url('js/local/bootstrap.bundle.min.js') }}"></script>
        <script src="{{ static_url('js/local/htmx.min.js') }}"></script>
        <script src="{{ static_url('js/local/htmx-ws.js') }}"></script>
        <script src="{{ static_url('js/local/turndown.js') }}"></script>
        <script src="{{ static_url('js/csrf.js') }}"></script>
        <script src="{{ static_url('js/ui.js') }}"></script>
        {# custom scripts in different templates #}
        {% block scripts %}{% endblock %}
        <!-- Toast container for displaying errors -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="app-toast"
                 class="toast"
                 role="alert"
                 aria-live="assertive"
                 aria-atomic="true">
                <div id="toast-header" class="toast-header bg-danger text-white">
                    <strong id="toast-title" class="me-auto">An Error Occurred</strong>
                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="toast"
                            aria-label="Close"></button>
                </div>
                <div class="toast-body" id="toast-body-content">
                    <!-- Error message will be injected here -->
                </div>
            </div>
        </div>
        <!-- end toast -->
    </body>
</html>
