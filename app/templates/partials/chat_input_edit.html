<div id="chat-input-container" class="chat-input-form">
    {# hx-put/hx-target save the edit over the original message; once that
       succeeds, data-after-save swaps this composer back for the default one
       (chat.js), leaving edit mode. #}
    <form hx-put="/chat/message/{{ message.id }}"
          hx-target="#message-{{ message.id }}"
          hx-swap="outerHTML"
          data-after-save="/chat/input/default"
          data-after-save-target="#chat-input-container"
          id="message-form"
          data-editor=""
          autocomplete="off">
        <input type="file" id="file-attachment-input" class="d-none" multiple>
        <input type="hidden" name="attachment_file_ids" id="attachment-file-ids">
        <div class="wysiwyg-editor-container">
            <div id="attachment-previews" class="p-2 flex-wrap gap-2 is-hidden">
                <!-- Image previews will be injected here by JavaScript -->
            </div>
            <!-- Editing Block UI -->
            <div class="editing-block p-2 rounded">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <strong class="d-block">Editing Message</strong>
                        <p class="mb-0 text-muted">{{ message.content | emojize | truncate(150, True) }}</p>
                    </div>
                    <button type="button"
                            class="btn-close"
                            aria-label="Cancel Edit"
                            title="Cancel Edit"
                            hx-get="/chat/input/default"
                            hx-target="#chat-input-container"
                            hx-swap="outerHTML"></button>
                </div>
            </div>
            <div id="typing-indicator" class="text-muted small"></div>
            <div class="wysiwyg-toolbar toolbar-hidden">
                <button type="button" data-command="bold" title="Bold (Ctrl+B)">
                    <i class="bi bi-type-bold"></i>
                </button>
                <button type="button" data-command="italic" title="Italic (Ctrl+I)">
                    <i class="bi bi-type-italic"></i>
                </button>
                <button type="button" data-command="strikethrough" title="Strikethrough">
                    <i class="bi bi-type-strikethrough"></i>
                </button>
                <button type="button"
                        data-command="insertUnorderedList"
                        title="Bulleted List">
                    <i class="bi bi-list-ul"></i>
                </button>
                <button type="button" data-command="insertOrderedList" title="Numbered List">
                    <i class="bi bi-list-ol"></i>
                </button>
                <button type="button"
                        data-command="formatBlock"
                        data-value="blockquote"
                        title="Quote">
                    <i class="bi bi-quote"></i>
                </button>
                <button type="button"
                        data-command="formatBlock"
                        data-value="pre"
                        title="Code Block">
                    <i class="bi bi-code-slash"></i>
                </button>
            </div>
            <!-- Rich Text Format -->
            <div id="wysiwyg-editor"
                 class="wysiwyg-content{% if not g.user.wysiwyg_enabled %} is-hidden{% endif %}"
                 contenteditable="true"></div>
            <!-- Markdow Format -->
            <textarea id="markdown-toggle-view"
                      class="form-control{% if g.user.wysiwyg_enabled %} is-hidden{% endif %}"
                      rows="1">{{ message.content }}</textarea>
            <!-- This hidden input will hold the final markdown content for submission -->
            <textarea class="d-none" id="chat-message-input" name="content">{{ message.content }}</textarea>
            <div class="wysiwyg-toolbar wysiwyg-toolbar-bottom">
                <button type="button" id="format-toggle-btn" title="Toggle Rich Formatting">
                    <i class="bi bi-type"></i>
                </button>
                <button type="button" id="file-attachment-btn" title="Attach a file">
                    <i class="bi bi-paperclip"></i>
                </button>
                <button type="button" id="mention-btn" title="Mention User">
                    <i class="bi bi-at"></i>
                </button>
                <button type="button" id="emoji-btn" title="Add Emoji">
                    <i class="bi bi-emoji-smile"></i>
                </button>
                <div class="ms-auto d-flex align-items-center">
                    <button id="send-button"
                            type="submit"
                            class="btn btn-primary send-btn-dynamic"
                            data-send-label="Save">Save</button>
                </div>
            </div>
        </div>
        <div class="is-hidden" id="emoji-picker-container">
            <emoji-picker class="light" data-source="/js/local/emoji.json"></emoji-picker>
        </div>
    </form>
    <div class="d-none" id="typing-sender" ws-send hx-trigger="typing-event"></div>
</div>
