<form hx-put="{{ url_for('channels.update_channel_about', channel_id=channel.id) }}"
      hx-target="#about-section-wrapper"
      hx-swap="innerHTML">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="text-muted mb-0">Edit Details</h6>
    </div>
    {% if error %}<div class="alert alert-danger py-2 small mb-2" role="alert">{{ error }}</div>{% endif %}
    {% set is_default_channel = channel.name in ['general', 'announcements'] %}
    <div class="mb-2">
        <label for="name" class="form-label small">Channel Name</label>
        <div class="input-group input-group-sm">
            <span class="input-group-text">#</span>
            <input type="text"
                   class="form-control form-control-sm"
                   id="name"
                   name="name"
                   value="{{ name if name is defined else (channel.name or '') }}"
                   required
                   minlength="3"
                   maxlength="80"
                   autocomplete="off"
                   {% if is_default_channel %}disabled{% endif %}>
        </div>
        {% if is_default_channel %}
            <div class="form-text">Default channel names cannot be changed.</div>
        {% else %}
            <div class="form-text">Lowercase letters, numbers, hyphens, and underscores. Spaces become hyphens.</div>
        {% endif %}
    </div>
    <div class="mb-2">
        <label for="topic" class="form-label small">Topic</label>
        <input type="text"
               class="form-control form-control-sm"
               id="topic"
               name="topic"
               value="{{ topic if topic is defined else (channel.topic or '') }}">
    </div>
    <div class="mb-3">
        <label for="description" class="form-label small">Description</label>
        <textarea class="form-control form-control-sm"
                  id="description"
                  name="description"
                  rows="3">{{ description if description is defined else (channel.description or '') }}</textarea>
    </div>
    <div class="text-end">
        <button type="button"
                class="btn btn-sm btn-secondary"
                hx-get="{{ url_for('channels.get_channel_details_about_display', channel_id=channel.id) }}"
                hx-target="#about-section-wrapper"
                hx-swap="innerHTML">Cancel</button>
        <button type="submit" class="btn btn-sm btn-primary">Save</button>
    </div>
</form>
