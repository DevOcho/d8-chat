# How auto 0.9 and newer route traffic to d8-chat. auto 0.8 and older keep
# using the Ingress in deployment.yaml. nginx's proxy-body-size needs nothing
# here: Envoy sets no body limit, so the app's own applies.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: d8-chat
  namespace: default
spec:
  parentRefs:
  - name: auto
    namespace: auto-gateway
  hostnames:
  - d8-chat.local
  rules:
  - backendRefs:
    - name: d8-chat
      port: 80
